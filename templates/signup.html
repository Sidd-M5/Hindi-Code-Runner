<!DOCTYPE html>
<html lang="hi" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <title>साइन अप – CodeMorph</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --c-bg:            #0b0a18;
      --c-surface:       #131228;
      --c-surface2:      #1c1a35;
      --c-border:        #2e2b50;
      --c-accent:        #f97316;
      --c-accent-dim:    rgba(249,115,22,0.15);
      --c-accent-glow:   rgba(249,115,22,0.35);
      --c-secondary:     #818cf8;
      --c-secondary-dim: rgba(129,140,248,0.15);
      --c-text:          #e8e6f5;
      --c-text-muted:    #8b88b0;
      --c-text-dim:      #4a4770;
      --c-red:           #f85149;
      --c-red-dim:       rgba(248,81,73,0.12);
      --font-ui:         'Inter','Noto Sans Devanagari',sans-serif;
      --font-code:       'JetBrains Mono','Consolas',monospace;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { height: 100%; }

    body {
      font-family: var(--font-ui);
      background: var(--c-bg);
      color: var(--c-text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── Nav ── */
    .topnav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 56px;
      padding: 0 1.25rem;
      background: var(--c-surface);
      border-bottom: 1px solid var(--c-border);
      flex-shrink: 0;
    }

    .nav-brand {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      text-decoration: none;
    }
    .brand-logo {
      font-family: var(--font-code);
      font-size: 1.05rem;
      font-weight: 600;
      color: var(--c-text-muted);
    }
    .brand-logo .slash { color: var(--c-accent); }
    .brand-info { display: flex; flex-direction: column; line-height: 1.1; }
    .brand-title {
      font-size: 0.95rem;
      font-weight: 700;
      background: linear-gradient(90deg, #f97316, #818cf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .brand-tag {
      font-size: 0.6rem;
      color: var(--c-text-dim);
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }
    .version-badge {
      font-size: 0.65rem;
      padding: 0.1rem 0.4rem;
      border-radius: 20px;
      background: var(--c-accent-dim);
      color: var(--c-accent);
      font-weight: 600;
      border: 1px solid var(--c-accent-glow);
      letter-spacing: 0.04em;
    }
    .nav-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      padding: 0.35rem 0.75rem;
      border: 1px solid var(--c-border);
      border-radius: 6px;
      background: var(--c-surface2);
      color: var(--c-text-muted);
      font-size: 0.8rem;
      font-weight: 500;
      text-decoration: none;
      transition: all 0.15s;
    }
    .nav-btn:hover {
      border-color: var(--c-accent);
      color: var(--c-accent);
      background: var(--c-accent-dim);
    }

    /* ── Page ── */
    .page {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
    }

    .auth-card {
      width: 100%;
      max-width: 400px;
      background: var(--c-surface);
      border: 1px solid var(--c-border);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 16px 40px rgba(11,10,24,0.7);
    }

    .auth-header {
      padding: 1.75rem 1.75rem 1.25rem;
      border-bottom: 1px solid var(--c-border);
      background: var(--c-surface2);
    }
    .auth-header h2 {
      font-size: 1.2rem;
      font-weight: 700;
      color: var(--c-text);
      margin-bottom: 0.25rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .auth-header p {
      font-size: 0.83rem;
      color: var(--c-text-muted);
    }

    .auth-body { padding: 1.75rem; }

    .form-group { margin-bottom: 1.1rem; }

    label {
      display: block;
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--c-text-muted);
      margin-bottom: 0.4rem;
      letter-spacing: 0.03em;
      text-transform: uppercase;
    }

    input[type="text"],
    input[type="password"] {
      width: 100%;
      padding: 0.6rem 0.85rem;
      background: var(--c-bg);
      border: 1px solid var(--c-border);
      border-radius: 6px;
      color: var(--c-text);
      font-size: 0.88rem;
      font-family: var(--font-ui);
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    input[type="text"]:focus,
    input[type="password"]:focus {
      border-color: var(--c-secondary);
      box-shadow: 0 0 0 3px var(--c-secondary-dim);
    }
    input::placeholder { color: var(--c-text-dim); }

    .error-msg {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.7rem 0.9rem;
      background: var(--c-red-dim);
      border: 1px solid rgba(248,81,73,0.3);
      border-left: 3px solid var(--c-red);
      border-radius: 6px;
      color: var(--c-red);
      font-size: 0.83rem;
      margin-bottom: 1.1rem;
    }

    .submit-btn {
      width: 100%;
      padding: 0.72rem;
      background: linear-gradient(90deg, #ea580c 0%, #f97316 50%, #fb923c 100%);
      background-size: 200% 100%;
      background-position: right center;
      border: none;
      border-radius: 6px;
      color: #fff;
      font-size: 0.92rem;
      font-weight: 700;
      font-family: var(--font-ui);
      cursor: pointer;
      letter-spacing: 0.02em;
      transition: background-position 0.3s, box-shadow 0.2s;
      margin-top: 0.4rem;
    }
    .submit-btn:hover {
      background-position: left center;
      box-shadow: 0 4px 20px rgba(249,115,22,0.4);
    }

    .auth-footer {
      padding: 1rem 1.75rem;
      border-top: 1px solid var(--c-border);
      background: var(--c-surface2);
      font-size: 0.82rem;
      color: var(--c-text-muted);
      text-align: center;
    }
    .auth-footer a {
      color: var(--c-secondary);
      text-decoration: none;
      font-weight: 600;
    }
    .auth-footer a:hover { text-decoration: underline; }

    /* ── Status bar ── */
    .statusbar {
      height: 26px;
      background: var(--c-accent);
      display: flex;
      align-items: center;
      padding: 0 1rem;
      font-family: var(--font-code);
      font-size: 0.7rem;
      color: rgba(255,255,255,0.85);
      flex-shrink: 0;
      gap: 1rem;
    }
  </style>
</head>
<body>

  <nav class="topnav">
    <a class="nav-brand" href="/">
      <div class="brand-logo"><span>&lt;</span><span class="slash">/</span><span>&gt;</span></div>
      <div class="brand-info">
        <span class="brand-title">CodeMorph</span>
        <span class="brand-tag">HindCode IDE</span>
      </div>
      <span class="version-badge">v1.0</span>
    </a>
    <a class="nav-btn" href="/">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      होम
    </a>
  </nav>

  <div class="page">
    <div class="auth-card">

      <div class="auth-header">
        <h2>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#818cf8" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          अकाउंट बनाएँ
        </h2>
        <p>CodeMorph पर हिंदी में कोड करना शुरू करें</p>
      </div>

      <div class="auth-body">
        {% if error %}
          <div class="error-msg">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
            {{ error }}
          </div>
        {% endif %}

        <form method="POST" action="/signup">
          <div class="form-group">
            <label for="username">यूज़रनेम</label>
            <input type="text" id="username" name="username" placeholder="एक यूनिक यूज़रनेम चुनें" required>
          </div>
          <div class="form-group">
            <label for="password">पासवर्ड</label>
            <input type="password" id="password" name="password" placeholder="••••••••" required>
          </div>
          <button type="submit" class="submit-btn">अकाउंट बनाएँ</button>
        </form>
      </div>

      <div class="auth-footer">
        पहले से अकाउंट है? <a href="/login">लॉगिन करें</a>
      </div>

    </div>
  </div>

  <div class="statusbar">
    <span>CodeMorph</span>
    <span>HindCode IDE</span>
    <span>v1.0</span>
  </div>

</body>
</html>
